meta:
  date_updated: "2026-10-17"
  hardware:
    apple_64gb: supported

variants:
  mlx_int4:
    label: MLX 4-bit
    model_id: mlx-community/Qwen3.5-35B-A3B-4bit
    description: |-
      Qwen3.5-35B-A3B, with room for many conversations of about 24,000 words
      at once.
    precision: int4
    # ceil(20,391,405,152 checkpoint bytes / 1e9 * 1.2), not a serving budget.
    vram_minimum_gb: 25
    supported_hardware: [apple_64gb]
    min_vllm_version: "0.31.0"
    install:
      pip:
        note: Requires Apple Silicon and macOS 15 or later. Install vLLM Metal.
        command: |
          curl -fsSL https://raw.githubusercontent.com/vllm-project/vllm-metal/main/install.sh | bash
          source ~/.venv-vllm-metal/bin/activate
      docker: false
    supported_frontends: [python]
    supported_features: []
    base_args:
      - --host
      - "127.0.0.1"
      - --max-model-len
      - "32768"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
    guide: |
      - The first run downloads 20 GB.
      - It is the fastest of the three, because only part of the model runs for
        each word.

strategy_hardware:
  single_node_tep:
    metal: unsupported
  single_node_dep:
    metal: unsupported
