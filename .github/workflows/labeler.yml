name: Label PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write # Create configured labels that do not exist yet.
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          sync-labels: false
